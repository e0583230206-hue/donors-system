name: Deploy to Production

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    # Runs the full backend test suite (frontend/backend/*.test.js and
    # scripts/*.test.js — 21 files as of this writing) on a clean GitHub-hosted
    # runner, entirely separate from the production server. These tests are
    # pure/DI-style or use their own temporary sqlite files (see each file's
    # own header comment) — none of them touch the real server, its .env, or
    # its data.sqlite, so running them here is safe and requires no secrets.
    #
    # Runs on both push-to-master and any pull_request targeting master —
    # the pull_request trigger is a pre-merge gate only (see the deploy job
    # below, which stays push-to-master-only): it lets a PR show real,
    # GitHub-verified check results before merge, without giving pull_request
    # events any ability to reach the deploy job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - name: Install dependencies
        working-directory: frontend/backend
        run: npm ci
      - name: Run test suite
        working-directory: frontend/backend
        run: npm test

  deploy:
    needs: test # deploy must never start if a single test failed
    # Restricts this job to an actual push to master — without this, adding
    # the pull_request trigger above would make GitHub evaluate this job on
    # pull_request events too (the "needs: test" dependency alone doesn't
    # scope deploy to any particular trigger type). A merge is a push event,
    # so the existing "deploy runs after a push to master" behavior for a
    # merged PR is unchanged.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          # Must be whichever user actually runs the live pm2 process (verify
          # with `pm2 list` on the server as that user, or `pm2 list` as root
          # if pm2 was started under root) — pm2's process list is per-user,
          # so restarting from the wrong user will fail with "process not found".
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/donors-system
            git pull origin master
            cd frontend/backend
            npm ci --omit=dev
            # Idempotent — only ever inserts a row that's still missing by
            # audioId, never touches an existing one. Safe to run on every
            # deploy forever; a no-op once all rows already exist.
            node seed-ident-audio.js
            # Same idempotent insert-only pattern as above, for the 24
            # PAYMSG-3000..3023 systemMessages rows (see
            # seed-paymsg-audio.test.js). Does not set audioFile1/2/3 or
            # touch IVR_AUDIO_PAYMSG_MODE — the payment-messages feature
            # stays off until explicitly enabled.
            node seed-paymsg-audio.js
            pm2 restart donors --update-env
